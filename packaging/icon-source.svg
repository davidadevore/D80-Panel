<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1e25"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#sheen)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="#2c313a" stroke-width="4"/>

  <!-- meter bars, rising left to right like a channel climbing toward clip -->
  <g>
    <rect x="232" y="530" width="80" height="220" rx="24" fill="#2ecc71"/>
    <rect x="352" y="430" width="80" height="320" rx="24" fill="#2ecc71"/>
    <rect x="472" y="330" width="80" height="420" rx="24" fill="#e3c23a"/>
    <rect x="592" y="230" width="80" height="520" rx="24" fill="#f5c518"/>
    <g filter="url(#glow)">
      <rect x="712" y="100" width="80" height="650" rx="24" fill="#ff3b3b"/>
    </g>
  </g>
</svg>
